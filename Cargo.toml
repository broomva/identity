[package]
name = "identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Typed identity of hosts, agents and the owner, shared by Maestro and the change plane."
repository = "https://github.com/broomva/identity"
readme = "README.md"
keywords = ["identity", "serde"]
categories = ["data-structures", "encoding"]
include = [
    "/src",
    "/examples",
    "/schema",
    "/docs",
    "/bindings/python",
    "/bindings/typescript/check.ts",
    "/bindings/typescript/package.json",
    "/bindings/typescript/schema.json",
    "/bindings/typescript/bun.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
schemars = "1.2"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
